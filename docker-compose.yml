services:
  pilketos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pilketos_app
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      # Persist SQLite database outside the container
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
      # Persist uploaded candidate photos
      - ./storage/foto_calon:/var/www/html/storage/foto_calon
      # Persist logs
      - ./storage/logs:/var/www/html/storage/logs
      # Mount .env for artisan commands inside the container
      - ./.env:/var/www/html/.env
    # All secrets and config live in .env on the VPS (never committed to git)
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "php", "artisan", "up"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - pilketos_network

networks:
  pilketos_network:
    driver: bridge
